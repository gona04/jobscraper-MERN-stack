<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 11px;
      line-height: 1.45;
      color: #111;
      margin: 0;
      max-width: 800px;
    }

    .container {
      width: 100%;
      padding: 20px 24px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      align-items: flex-start;
    }

    .contact {
      text-align: right;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    h2 {
      font-size: 13px;
      margin-top: 14px;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .experience {
      margin-bottom: 10px;
    }

    .project {
      margin-bottom: 10px;
    }

    .education {
      margin-bottom: 12px;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .exp-meta {
      text-align: right;
      font-size: 10px;
      color: #555;
    }

    p {
      margin: 0 0 6px;
    }

    ul {
      margin: 4px 0 10px 16px;
      padding: 0;
    }

    li {
      margin-bottom: 4px;
    }

    .role-title {
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .compact .container {
      padding: 16px 20px;
    }

    .compact h2 {
      margin-top: 12px;
      margin-bottom: 5px;
    }

    .compact p {
      margin-bottom: 5px;
    }

    .compact .project,
    .compact .experience,
    .compact .education {
      margin-bottom: 8px;
    }

    a {
      color: #1a56db;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>{{name}}</h1>
      </div>
      <div class="contact">
        {{email}}<br/>
        {{phone}}<br/>
        {{linkedin}}
      </div>
    </div>

    {{roleTitle}}
    {{summarySection}}
    {{skillsSection}}
    {{projectsSection}}
    {{experienceSection}}
    {{educationSection}}
    {{certificationsSection}}
  </div>
</body>
</html>
