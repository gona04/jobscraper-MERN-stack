<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 11.5px;
      line-height: 1.5;
      color: #111;
      margin: 0;
    }

    .container {
      width: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .contact {
      text-align: right;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    h2 {
      font-size: 13px;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    .experience {
      margin-bottom: 10px;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }

    .exp-meta {
      text-align: right;
      font-size: 10.5px;
    }

    p {
      margin: 0 0 8px;
    }

    ul {
      margin: 4px 0 10px 16px;
      padding: 0;
    }

    li {
      margin-bottom: 2px;
    }

    a {
      color: #1a56db;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>{{name}}</h1>
      </div>
      <div class="contact">
        {{email}}<br/>
        {{phone}}<br/>
        {{linkedin}}
      </div>
    </div>

    {{summarySection}}
    {{skillsSection}}
    {{experienceSection}}
    {{projectsSection}}
  </div>
</body>
</html>
